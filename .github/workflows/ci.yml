name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check app scripts
      - name: Import check
        run: |
          python -c "import app.config, app.db, app.graph, app.github_client, app.render, app.worker, app.main; print('all modules import')"
        env:
          GITHUB_WEBHOOK_SECRET: ci-dummy-secret
      - name: Tests
        run: python -m pytest